<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bingo de Yois - Profesional</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                }
            }
        }
    </script>
    <style>
        * { box-sizing: border-box; }
        html, body { 
            max-width: 100%; 
            width: 100%;
            overflow-x: hidden; 
            margin: 0;
            padding: 0;
        }

        #win-modal > div { max-width: 650px !important; width: 92% !important; }
        .cartones-ganadores-grid {
            display: flex; flex-wrap: wrap; gap: 12px;
            justify-content: center; max-height: 350px; overflow-y: auto; margin: 12px 0;
        }
        .mini-carton-ganador {
            background: #1e293b; color: #fff; padding: 10px; border-radius: 8px; width: 165px;
            border: 1px solid rgba(255,215,0,0.4);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .mini-carton-ganador h4 { font-size: 11px; margin-bottom: 2px; color: #ffD700; font-weight: bold; }
        .mini-carton-ganador .ganador-jugador { font-size: 10px; color: #38bdf8; margin-bottom: 6px; font-weight: bold; }
        .mini-carton-ganador .ganador-modalidad { font-size: 9px; background: rgba(239, 68, 68, 0.2); color: #fca5a5; padding: 2px 4px; border-radius: 4px; margin-bottom: 6px; display: inline-block; border: 1px solid rgba(239, 68, 68, 0.4); }
        .mini-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; }
        .mini-celda {
            background: #334155; font-size: 9px; height: 22px;
            display: flex; align-items: center; justify-content: center; border-radius: 3px; font-weight: bold; color: #cbd5e1;
        }
        .mini-celda.ganadora { background: #ef4444 !important; color: white !important; transform: scale(1.05); }
        .mini-celda.libre { background: #10b981 !important; color: white !important; font-size: 7px; }

        /* Estilos de fichas marcadas dinámicas */
        .bingo-cell-marked-emerald { background: linear-gradient(135deg, #059669 0%, #047857 100%) !important; color: white !important; border-color: #34d399 !important; transform: scale(0.95); box-shadow: inset 0 2px 4px rgba(0,0,0,0.2); }
        .bingo-cell-marked-purple { background: linear-gradient(135deg, #9333ea 0%, #7e22ce 100%) !important; color: white !important; border-color: #c084fc !important; transform: scale(0.95); box-shadow: inset 0 2px 4px rgba(0,0,0,0.2); }
        .bingo-cell-marked-blue { background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%) !important; color: white !important; border-color: #60a5fa !important; transform: scale(0.95); box-shadow: inset 0 2px 4px rgba(0,0,0,0.2); }
        .bingo-cell-marked-rose { background: linear-gradient(135deg, #db2777 0%, #be185d 100%) !important; color: white !important; border-color: #f472b6 !important; transform: scale(0.95); box-shadow: inset 0 2px 4px rgba(0,0,0,0.2); }
        .bingo-cell-marked-indigo { background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%) !important; color: white !important; border-color: #818cf8 !important; transform: scale(0.95); box-shadow: inset 0 2px 4px rgba(0,0,0,0.2); }
        .bingo-cell-marked-orange { background: linear-gradient(135deg, #ea580c 0%, #c2410c 100%) !important; color: white !important; border-color: #fb923c !important; transform: scale(0.95); box-shadow: inset 0 2px 4px rgba(0,0,0,0.2); }
        .bingo-cell-marked-vino {
            background: linear-gradient(135deg, #722F37 0%, #4A151B 100%) !important;
            color: white !important;
            border-color: #D27D7D !important;
            transform: scale(0.95);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
        }
        .bingo-cell-marked-celeste { background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%) !important; color: white !important; border-color: #7dd3fc !important; transform: scale(0.95); box-shadow: inset 0 2px 4px rgba(0,0,0,0.2); }
        .bingo-cell-marked-red { background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%) !important; color: white !important; border-color: #f87171 !important; transform: scale(0.95); box-shadow: inset 0 2px 4px rgba(0,0,0,0.2); }
        .master-cell-marked { background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%) !important; color: white !important; border-color: #4338ca !important; box-shadow: 0 2px 4px rgba(99, 102, 241, 0.3); }
        .double-frame { border: 2px solid #6366f1; box-shadow: 0 0 0 1px #334155, 0 6px 15px -4px rgba(0, 0, 0, 0.4); }
        
        @keyframes titilarFaltanteMaestro {
          0% { background-color: #f59e0b; border-color: #fef08a; transform: scale(1); box-shadow: 0 0 6px #f59e0b; color: #0f172a; }
          50% { background-color: #b45309; border-color: #fde68a; transform: scale(1.06); box-shadow: 0 0 12px #fbbf24; color: #ffffff; }
          100% { background-color: #f59e0b; border-color: #fef08a; transform: scale(1); box-shadow: 0 0 6px #f59e0b; color: #0f172a; }
        }
        .master-cell-missing { animation: titilarFaltanteMaestro 0.8s infinite ease-in-out !important; font-weight: 900 !important; z-index: 10; }

        /* Contenedor de cartones activos */
        .cards-horizontal-container {
            display: grid;
            grid-template-columns: repeat(1, minmax(0, 1fr));
            gap: 0.5rem;
            max-height: 55vh;
            overflow-y: auto;
            overflow-x: hidden;
            width: 100%;
        }
        @media (min-width: 640px) {
            .cards-horizontal-container { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }
        .cards-horizontal-container > div { width: 100%; min-width: 0; }

        /* =========================================================
           OPTIMIZACIÓN ESTRICTA PARA MODO LADO A LADO EN MÓVILES
           ========================================================= */
        body.side-by-side-mobile #main-container-layout {
            display: grid !important;
            grid-template-columns: 42% 58% !important;
            gap: 4px !important;
            padding: 4px !important;
            width: 100% !important;
            max-width: 100% !important;
            align-items: start !important;
        }
        body.side-by-side-mobile #master-board-section,
        body.side-by-side-mobile #right-panel-section {
            min-width: 0 !important;
            width: 100% !important;
            gap: 6px !important;
        }
        /* Compactar Tablero Maestro */
        body.side-by-side-mobile #master-board-card {
            padding: 5px !important;
        }
        body.side-by-side-mobile #master-board-card h3 {
            font-size: 9px !important;
        }
        body.side-by-side-mobile #drawn-count-badge {
            font-size: 8px !important;
            padding: 1px 4px !important;
        }
        body.side-by-side-mobile #btn-reset-game {
            font-size: 8px !important;
            padding: 2px 4px !important;
        }
        body.side-by-side-mobile #master-board-columns {
            gap: 2px !important;
        }
        body.side-by-side-mobile #master-board-columns > div {
            gap: 2px !important;
        }
        body.side-by-side-mobile #master-board-columns button {
            height: 1.15rem !important;
            font-size: 8.5px !important;
            padding: 0 !important;
        }
        /* Compactar Panel Derecho y Cartones */
        body.side-by-side-mobile .cards-horizontal-container {
            grid-template-columns: repeat(1, minmax(0, 1fr)) !important;
            max-height: 62vh !important;
            gap: 6px !important;
        }
        body.side-by-side-mobile .active-card-box {
            padding: 5px !important;
        }
        body.side-by-side-mobile .active-card-cell {
            height: 1.35rem !important;
            font-size: 9.5px !important;
        }
        body.side-by-side-mobile .card-player-input {
            font-size: 9px !important;
            padding: 1px 4px !important;
            min-width: 0 !important;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-[100dvh] flex flex-col font-sans overflow-x-hidden text-xs">

    <!-- Header ultra-adaptable para móviles -->
<!-- Header compacto con Proyector integrado -->
    <header class="bg-slate-800 border-b border-slate-700 px-2.5 py-1.5 flex flex-wrap justify-between items-center shadow-md gap-1.5 w-full">
        <div class="flex items-center space-x-1.5 min-w-0">
            <div class="bg-gradient-to-tr from-indigo-600 to-violet-500 p-1.5 rounded-lg shadow-md text-white shrink-0">
                <i class="fa-solid fa-ticket text-xs"></i>
            </div>
            <div class="truncate">
                <h1 class="text-xs sm:text-sm font-bold tracking-tight text-white flex items-center gap-1 truncate">
                  <span class="truncate">BINGO DE YOIS</span>
                  <span class="text-[8px] bg-indigo-500/20 text-indigo-400 border border-indigo-500/30 px-1 py-0.2 rounded-full font-medium shrink-0">Cloud</span>
                </h1>
            </div>
        </div>

        <!-- Controles y Botón de Proyector en la parte superior derecha -->
        <div class="flex items-center gap-1 shrink-0">
            <select id="bg-theme-selector" onchange="changeBackgroundTheme(this.value)" aria-label="Tema" class="bg-slate-900 text-slate-200 text-[10px] px-1.5 py-1 rounded-lg border border-slate-700 outline-none cursor-pointer max-w-[85px] sm:max-w-none truncate">
                <option value="dark">Oscuro</option>
                <option value="vino">Vino Tinto</option>
                <option value="emerald">Esmeralda</option>
                <option value="purple">Morado</option>
            </select>

            <button onclick="toggleSideBySideMode()" id="btn-side-side" class="bg-emerald-600/30 hover:bg-emerald-600/50 text-emerald-300 border border-emerald-500/40 px-2 py-1 rounded-lg text-[10px] font-semibold transition flex items-center gap-1 shadow-sm" title="Alternar Modo Lado a Lado">
                <i class="fa-solid fa-columns"></i> <span class="hidden xs:inline sm:inline">Lado/Lado</span>
            </button>

            <button onclick="openCardSelectorModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-2 py-1 rounded-lg text-[10px] font-semibold transition flex items-center gap-1 shadow-sm">
                <i class="fa-solid fa-sliders"></i> <span>Cartones</span>
            </button>

            <!-- Botón Proyector FIJO en la parte superior -->
            <button onclick="openProjectorMode()" class="bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white px-2.5 py-1 rounded-lg text-[10px] font-semibold transition flex items-center gap-1 shadow-sm border border-indigo-400/40" title="Modo Proyector">
                <i class="fa-solid fa-person-chalkboard"></i> <span>Proyector</span>
            </button>

            <button onclick="downloadApp()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 p-1.5 rounded-lg text-[10px] font-semibold transition border border-slate-600" title="Descargar App">
                <i class="fa-solid fa-download text-indigo-400"></i>
            </button>
        </div>
    </header>

    <!-- Main Content Layout -->
    <main class="flex-1 max-w-[1600px] w-full mx-auto p-2 sm:p-4 flex flex-col lg:grid lg:grid-cols-12 gap-2.5 items-start" id="main-container-layout">
        
        <!-- Left Column (Tablero Maestro) -->
        <section class="w-full min-w-0 lg:col-span-5 flex flex-col gap-2.5" id="master-board-section">
            <div id="master-board-card" class="bg-slate-800 rounded-xl p-2 sm:p-3 shadow-xl flex flex-col double-frame w-full min-w-0">
                <div class="flex flex-wrap justify-between items-center mb-1.5 gap-1">
                    <h3 class="text-[11px] sm:text-xs font-bold uppercase tracking-wider text-slate-300 flex items-center gap-1 truncate">
                        <i class="fa-solid fa-table-cells text-indigo-400"></i> <span>Tablero</span>
                    </h3>
                    <div class="flex items-center gap-1 shrink-0">
                        <span id="drawn-count-badge" class="text-[9px] bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 px-1.5 py-0.5 rounded-full font-semibold">0 cantados</span>
                        <button id="btn-reset-game" onclick="resetGame()" class="bg-rose-600/20 hover:bg-rose-600/30 text-rose-300 border border-rose-500/30 px-1.5 py-0.5 rounded text-[9px] font-semibold transition flex items-center gap-1">
                            <i class="fa-solid fa-rotate-right"></i> <span class="hidden sm:inline">Reiniciar</span>
                        </button>
                    </div>
                </div>

                <div class="mb-1.5 bg-slate-900 border border-indigo-500/30 rounded-lg p-1 flex items-center gap-1 overflow-x-auto shadow-inner w-full">
                    <span class="text-[9px] font-bold text-indigo-400 uppercase whitespace-nowrap shrink-0"><i class="fa-solid fa-clock-rotate-left"></i></span>
                    <div id="recent-balls-history" class="flex items-center gap-1">
                        <span class="text-[9px] text-slate-500 italic">Sin bolas</span>
                    </div>
                </div>

                <div class="grid grid-cols-5 gap-1 w-full" id="master-board-columns"></div>
            </div>

            <!-- Cartones a Pique -->
            <div class="bg-slate-800 border border-amber-500/40 rounded-xl p-2 shadow-xl flex flex-col gap-1.5 w-full min-w-0">
                <div class="flex items-center justify-between pb-1 border-b border-slate-700 gap-1">
                    <span class="text-[10px] font-bold uppercase tracking-wider text-amber-400 flex items-center gap-1 truncate">
                        <i class="fa-solid fa-triangle-exclamation shrink-0"></i> <span class="truncate">A Pique</span>
                    </span>
                    <span id="near-win-count-badge" class="text-[9px] bg-amber-500/20 text-amber-300 border border-amber-500/30 px-1.5 py-0.2 rounded-full font-semibold shrink-0">0</span>
                </div>
                <div id="near-win-cards-container" class="flex flex-col gap-1 max-h-28 overflow-y-auto">
                    <div class="text-[9px] text-slate-400 text-center py-1.5 italic">Ninguno a pique...</div>
                </div>
            </div>
        </section>

        <!-- Right Column (Modalidades y Cartones Activos) -->
        <section class="w-full min-w-0 lg:col-span-7 flex flex-col gap-2.5" id="right-panel-section">
            
            <!-- MODALIDADES CON MINIATURAS -->
            <div class="bg-slate-800 border border-slate-700 rounded-xl shadow-lg overflow-hidden p-1.5 sm:p-2 flex flex-col gap-1.5 w-full min-w-0">
                <div class="bg-slate-900 border border-indigo-500/30 rounded-lg p-1 flex items-center justify-between shadow-inner gap-1 min-w-0">
                    <div class="flex items-center gap-1.5 overflow-x-auto py-0.5 min-w-0 flex-1" id="active-modalities-preview-bar"></div>
                    <button onclick="toggleModalitiesDropdown()" class="text-[9px] bg-indigo-600/20 hover:bg-indigo-600/40 text-indigo-300 border border-indigo-500/40 px-2 py-1 rounded font-semibold whitespace-nowrap shrink-0 flex items-center gap-1">
                        <i class="fa-solid fa-sliders"></i> <span>Config</span>
                    </button>
                </div>

                <details id="modalities-details-box" class="group border border-slate-700/80 rounded-lg overflow-hidden bg-slate-900/50">
                    <summary class="p-2 bg-slate-800 hover:bg-slate-700/50 cursor-pointer flex flex-wrap items-center justify-between gap-1 transition select-none list-none text-[10px]">
                        <span class="font-bold uppercase tracking-wider text-white flex items-center gap-1">
                            <i class="fa-solid fa-list-check text-indigo-400"></i> Modalidades
                        </span>
                        <button onclick="event.stopPropagation(); openNewModalityModal();" class="bg-emerald-600 hover:bg-emerald-500 text-white px-2 py-0.5 rounded text-[9px] font-semibold flex items-center gap-1">
                            <i class="fa-solid fa-plus"></i> Nueva
                        </button>
                    </summary>
                    <div class="p-2 border-t border-slate-700/60 bg-slate-900/90 flex flex-col gap-2">
                        <div id="modalities-checkbox-container" class="bg-slate-950 border border-slate-800 rounded-lg p-1.5 max-h-40 overflow-y-auto space-y-1.5"></div>
                    </div>
                </details>
            </div>

            <!-- CARTONES ACTIVOS -->
            <div class="bg-slate-800 border border-slate-700 rounded-xl p-2 shadow-xl flex flex-col gap-2 w-full min-w-0">
                <div class="flex flex-wrap justify-between items-center gap-1">
                    <div class="flex items-center gap-1.5 min-w-0">
                        <span class="text-[11px] font-bold text-slate-300 uppercase tracking-wider truncate">Cartones</span>
                        <span id="active-cards-subtitle" class="text-[9px] text-indigo-400 font-medium shrink-0">0</span>
                    </div>
                    <div class="flex items-center gap-1 shrink-0">
                        <button onclick="clearAllMarks()" class="bg-slate-700 hover:bg-slate-600 text-slate-300 px-1.5 py-0.5 rounded text-[9px]">Limpiar</button>
                        <button onclick="removeAllActiveCards()" class="bg-rose-600/20 hover:bg-rose-600/30 text-rose-300 border border-rose-500/30 px-1.5 py-0.5 rounded text-[9px] font-semibold transition">Quitar</button>
                    </div>
                </div>
                <div class="bg-slate-800/60 border border-slate-700/80 rounded-xl p-1.5 shadow-inner min-h-0 flex flex-col w-full">
                    <div class="cards-horizontal-container" id="active-cards-container"></div>
                </div>
            </div>
        </section>
    </main>

    <!-- MODAL DE GANADOR -->
    <div id="win-modal" class="fixed inset-0 bg-slate-950/85 backdrop-blur-md z-[60] hidden flex items-center justify-center p-3">
        <div class="bg-slate-900 border-2 border-amber-400 rounded-2xl p-4 sm:p-6 shadow-2xl flex flex-col text-center">
            <div class="inline-flex mx-auto bg-amber-500/20 p-3 rounded-full text-amber-400 mb-2 border border-amber-500/40 animate-bounce">
                <i class="fa-solid fa-trophy text-2xl"></i>
            </div>
            <h2 class="text-lg sm:text-xl font-black text-amber-400 uppercase tracking-wide">¡BINGO GANADOR!</h2>
            <p id="win-modal-subtitle" class="text-xs text-slate-300 mt-1">¡Se ha completado una o más modalidades!</p>
            <div class="cartones-ganadores-grid" id="winning-cards-preview-container"></div>
            <div class="mt-4 flex justify-center">
                <button onclick="closeWinModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-6 py-2.5 rounded-xl text-xs font-semibold shadow-lg">Continuar Jugando</button>
            </div>
        </div>
    </div>

    <!-- MODAL MODO PROYECTOR INTERACTIVO -->
    <div id="projector-modal" class="fixed inset-0 bg-slate-950/95 backdrop-blur-md z-50 hidden flex flex-col p-2 sm:p-4 overflow-y-auto">
        <div class="flex justify-between items-center mb-2 pb-2 border-b border-slate-800 shrink-0 gap-2">
            <div class="flex items-center gap-2 min-w-0">
                <div class="bg-indigo-600/20 p-1.5 rounded-lg text-indigo-400 border border-indigo-500/30 shrink-0">
                    <i class="fa-solid fa-person-chalkboard text-sm"></i>
                </div>
                <div class="truncate">
                    <h2 class="text-xs sm:text-base font-black text-white uppercase tracking-wider truncate">Proyector Interactivo</h2>
                </div>
                <span id="projector-count-badge" class="bg-indigo-600/20 text-indigo-300 border border-indigo-500/30 text-[10px] font-bold px-2 py-0.5 rounded-full shrink-0">0</span>
            </div>
            <button onclick="closeProjectorMode()" class="bg-rose-600/20 hover:bg-rose-600/30 text-rose-300 border border-rose-500/30 px-2.5 py-1.5 rounded-xl text-xs font-semibold flex items-center gap-1 transition shrink-0">
                <i class="fa-solid fa-compress"></i> Salir
            </button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-2 mb-2 shrink-0">
            <div class="bg-slate-900 border border-indigo-500/30 rounded-lg p-1.5 flex items-center gap-1.5 shadow-inner overflow-x-auto">
                <span class="text-[10px] font-bold text-indigo-400 uppercase whitespace-nowrap"><i class="fa-solid fa-clock-rotate-left"></i> Últimas:</span>
                <div id="projector-recent-balls" class="flex items-center gap-1">
                    <span class="text-[10px] text-slate-500 italic">Ninguna</span>
                </div>
            </div>
            <div class="bg-slate-900 border border-indigo-500/30 rounded-lg p-1.5 flex items-center gap-2 shadow-inner overflow-x-auto" id="projector-modalities-bar"></div>
            <div class="bg-slate-900 border border-amber-500/40 rounded-lg p-1.5 flex items-center justify-between shadow-inner gap-2">
                <span class="text-[10px] font-bold text-amber-400 uppercase flex items-center gap-1 shrink-0"><i class="fa-solid fa-triangle-exclamation"></i> A Pique:</span>
                <div id="projector-near-win-container" class="flex items-center gap-1 overflow-x-auto">
                    <span class="text-[10px] text-slate-500 italic">Ninguno</span>
                </div>
            </div>
        </div>

        <div class="max-w-5xl w-full mx-auto flex-1 flex flex-col justify-center">
            <div id="projector-board-grid" class="grid grid-cols-5 gap-1 sm:gap-1.5 bg-slate-900/80 p-2 sm:p-3 rounded-2xl border border-slate-800 shadow-2xl"></div>
        </div>
    </div>

    <!-- MODAL NUEVA MODALIDAD -->
    <div id="new-modality-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-3">
        <div class="bg-slate-800 border border-emerald-500/40 rounded-2xl p-4 sm:p-6 max-w-md w-full shadow-2xl flex flex-col">
            <div class="flex justify-between items-center mb-3 pb-2 border-b border-slate-700">
                <h3 class="text-sm font-bold text-white"><i class="fa-solid fa-plus-circle text-emerald-400"></i> Crear Nueva Modalidad</h3>
                <button onclick="closeNewModalityModal()" class="text-slate-400 hover:text-white p-1.5"><i class="fa-solid fa-xmark text-base"></i></button>
            </div>
            <div class="space-y-3">
                <div>
                    <label class="text-[11px] text-slate-300 font-semibold block mb-1">Nombre de la Modalidad:</label>
                    <input type="text" id="new-mod-name" placeholder="Ej: La Letra X, Cruz, Marco..." class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-slate-200 outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="text-[11px] text-slate-300 font-semibold block mb-1">Descripción breve:</label>
                    <input type="text" id="new-mod-desc" placeholder="Ej: Forma una X en el cartón" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-slate-200 outline-none focus:border-emerald-500">
                </div>
                <div>

    <!-- Script de Lógica General y Firebase Unificado -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDiP9qIpq-4csLKL6-7ZAa1kIpUCgpbYbE",
            authDomain: "bingo-de-yois.firebaseapp.com",
            databaseURL: "https://bingo-de-yois-default-rtdb.firebaseio.com",
            projectId: "bingo-de-yois",
            storageBucket: "bingo-de-yois.firebasestorage.app",
            messagingSenderId: "460854612050",
            appId: "1:460854612050:web:92739a749f9048008a4f8b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);

        window.allAvailableCards = [];
        window.selectedCardsIds = [];
        window.cardMarks = {}; 
        window.playerNames = {}; 
        window.masterMarkedNumbers = new Set();
        window.alreadyDeclaredWins = new Set();
        window.drawnHistoryArray = [];

        window.gameModes = {
            blackout: { name: "Cartón Lleno", desc: "Todas las casillas.", isCellInPattern: (r, c) => true, active: true },
            diagonal: { name: "Diagonal", desc: "Cualquier diagonal.", isCellInPattern: (r, c) => (r === c) || (r + c === 4), active: false },
            horizontal: { name: "Horizontal", desc: "Fila completa.", isCellInPattern: (r, c) => false, active: false },
            vertical: { name: "Vertical", desc: "Columna completa.", isCellInPattern: (r, c) => false, active: false },
            corners: { name: "4 Esquinas", desc: "Las esquinas.", isCellInPattern: (r, c) => (r === 0 && c === 0) || (r === 0 && c === 4) || (r === 4 && c === 0) || (r === 4 && c === 4), active: false }
        };

        window.guardarEstadoEnLocalStorage = function() {
            localStorage.setItem('bingo_selectedCardsIds', JSON.stringify(window.selectedCardsIds));
            localStorage.setItem('bingo_cardMarks', JSON.stringify(window.cardMarks));
            localStorage.setItem('bingo_playerNames', JSON.stringify(window.playerNames));
            localStorage.setItem('bingo_masterMarkedNumbers', JSON.stringify(Array.from(window.masterMarkedNumbers)));
            localStorage.setItem('bingo_alreadyDeclaredWins', JSON.stringify(Array.from(window.alreadyDeclaredWins)));
            localStorage.setItem('bingo_drawnHistoryArray', JSON.stringify(window.drawnHistoryArray));
        }

        window.cargarEstadoDesdeLocalStorage = function() {
            try {
                const s = localStorage.getItem('bingo_selectedCardsIds');
                const m = localStorage.getItem('bingo_cardMarks');
                const p = localStorage.getItem('bingo_playerNames');
                const masterArr = localStorage.getItem('bingo_masterMarkedNumbers');
                const winsArr = localStorage.getItem('bingo_alreadyDeclaredWins');
                const histArr = localStorage.getItem('bingo_drawnHistoryArray');

                if (s) window.selectedCardsIds = JSON.parse(s);
                if (m) window.cardMarks = JSON.parse(m);
                if (p) window.playerNames = JSON.parse(p);
                if (masterArr) window.masterMarkedNumbers = new Set(JSON.parse(masterArr));
                if (winsArr) window.alreadyDeclaredWins = new Set(JSON.parse(winsArr));
                if (histArr) window.drawnHistoryArray = JSON.parse(histArr);
                return true;
            } catch(e) { return false; }
        }

        try {
            const savedModes = localStorage.getItem('bingo_custom_gameModes');
            if (savedModes) {
                let parsed = JSON.parse(savedModes);
                for (let k in parsed) {
                    let p = parsed[k];
                    let cellsSelectedMap = p.cellsMap || {};
                    window.gameModes[k] = {
                        name: p.name,
                        desc: p.desc,
                        active: p.active !== undefined ? p.active : true,
                        isCellInPattern: (r, c) => !!cellsSelectedMap[`${r}-${c}`]
                    };
                }
            }
            const savedPlayerNames = localStorage.getItem('bingo_playerNames');
            if (savedPlayerNames) {
                window.playerNames = JSON.parse(savedPlayerNames);
            }
        } catch(e){}

        window.saveGameModesToStorage = function() {
            let serializable = {};
            for (let k in window.gameModes) {
                let m = window.gameModes[k];
                let cellsMap = {};
                for (let r=0; r<5; r++) {
                    for (let c=0; c<5; c++) {
                        if (m.isCellInPattern(r, c)) cellsMap[`${r}-${c}`] = true;
                    }
                }
                serializable[k] = { name: m.name, desc: m.desc, active: m.active, cellsMap };
            }
            localStorage.setItem('bingo_custom_gameModes', JSON.stringify(serializable));
        }

        async function cargarCartonesDesdeFirebase() {
            try {
                await signInAnonymously(auth);
                const dbRef = ref(db);
                const snapshot = await get(dbRef);
                
                if (snapshot.exists()) {
                    const datos = snapshot.val();
                    let cartonesCargados = [];
                    let idGlobalContador = 1;

                    Object.keys(datos).forEach(nombreColorKey => {
                        let nodoColor = datos[nombreColorKey];
                        if (!nodoColor || typeof nodoColor !== 'object') return;

                        let nombreBonito = nombreColorKey.charAt(0).toUpperCase() + nombreColorKey.slice(1);
                        let temaCss = 'indigo';
                        let lowerColor = nombreColorKey.toLowerCase();

                        if (lowerColor.includes('tinto') || lowerColor.includes('vino') || lowerColor.includes('wine')) {
                            temaCss = 'vino';
                        } else if (lowerColor.includes('verde')) {
                            temaCss = 'emerald';
                        } else if (lowerColor.includes('morado') || lowerColor.includes('violeta') || lowerColor.includes('purple')) {
                            temaCss = 'purple';
                        } else if (lowerColor.includes('celeste') || lowerColor.includes('sky') || lowerColor.includes('cyan')) {
                            temaCss = 'celeste';
                        } else if (lowerColor.includes('azul') || lowerColor.includes('blue')) {
                            temaCss = 'blue';
                        } else if (lowerColor.includes('ros') || lowerColor.includes('pink')) {
                            temaCss = 'rose';
                        } else if (lowerColor.includes('roj') || lowerColor.includes('red')) {
                            temaCss = 'red';
                        } else if (lowerColor.includes('naranj') || lowerColor.includes('orange')) {
                            temaCss = 'orange';
                        } else {
                            temaCss = 'indigo'; 
                        }

                        const extraerDeNodo = (nodoActual, subNombreLote) => {
                            if (!nodoActual || typeof nodoActual !== 'object') return;

                            let keys = Object.keys(nodoActual);
                            let esContenedorDeCartones = keys.some(k => !isNaN(k) && typeof nodoActual[k] === 'object' && nodoActual[k] !== null);

                            if (esContenedorDeCartones) {
                                keys.forEach(keyCarton => {
                                    if (isNaN(keyCarton)) return;
                                    let cartonContainer = nodoActual[keyCarton];
                                    if (!cartonContainer || typeof cartonContainer !== 'object') return;

                                    let idCartonFinal = cartonContainer.id || cartonContainer.carton_id || keyCarton;
                                    let numeroLimpio = parseInt(String(idCartonFinal).replace(/\D/g, '')) || parseInt(keyCarton) || 0;

                                    let debeInvertir = false;
                                    if (lowerColor.includes('verde')) {
                                        debeInvertir = true;
                                    } else if (lowerColor.includes('azul') && numeroLimpio >= 61 && numeroLimpio <= 120) {
                                        debeInvertir = true;
                                    }

                                    let matrizFinal = Array(5).fill(0).map(() => Array(5).fill(0));
                                    let datosCargados = false;
                                    let letrasBingo = ['B', 'I', 'N', 'G', 'O'];
                                    let tieneLetrasBingo = letrasBingo.some(l => cartonContainer[l] !== undefined);

                                    if (tieneLetrasBingo || cartonContainer.columns) {
                                        let cols = cartonContainer.columns || cartonContainer;
                                        letrasBingo.forEach((letra, cIndex) => {
                                            let colData = cols[letra];
                                            if (colData && typeof colData === 'object') {
                                                for (let rIndex = 0; rIndex < 5; rIndex++) {
                                                    let val = colData[rIndex] !== undefined ? colData[rIndex] : colData[String(rIndex)];
                                                    if (val !== undefined) {
                                                        matrizFinal[rIndex][cIndex] = (val === "FREE") ? "FREE" : (parseInt(val) || 0);
                                                    }
                                                }
                                                datosCargados = true;
                                            }
                                        });
                                    }

                                    if (!datosCargados) {
                                        let fuenteMatriz = cartonContainer.matrix || cartonContainer;
                                        for (let r = 0; r < 5; r++) {
                                            let filaObj = fuenteMatriz[r] || fuenteMatriz[String(r)];
                                            if (filaObj && typeof filaObj === 'object') {
                                                for (let c = 0; c < 5; c++) {
                                                    let val = filaObj[c] !== undefined ? filaObj[c] : filaObj[String(c)];
                                                    if (val !== undefined) {
                                                        if (debeInvertir) {
                                                            matrizFinal[c][r] = (val === "FREE") ? "FREE" : (parseInt(val) || 0);
                                                        } else {
                                                            matrizFinal[r][c] = (val === "FREE") ? "FREE" : (parseInt(val) || 0);
                                                        }
                                                        datosCargados = true;
                                                    }
                                                }
                                            }
                                        }
                                    }

                                    if (!datosCargados && Array.isArray(cartonContainer.numbers)) {
                                        let idx = 0;
                                        for (let r = 0; r < 5; r++) {
                                            for (let c = 0; c < 5; c++) {
                                                let val = cartonContainer.numbers[idx++];
                                                matrizFinal[r][c] = (val === "FREE") ? "FREE" : (parseInt(val) || 0);
                                            }
                                        }
                                    }

                                    matrizFinal[2][2] = "FREE";

                                    let idUnicoGlobal = idGlobalContador++;
                                    let savedPlayerName = window.playerNames[idUnicoGlobal] || cartonContainer.playerName || "";

                                    cartonesCargados.push({
                                        id: idUnicoGlobal,
                                        title: `#${idCartonFinal}`,
                                        numberId: numeroLimpio,
                                        batch: subNombreLote,
                                        color: temaCss,
                                        numbers: matrizFinal,
                                        playerName: savedPlayerName
                                    });
                                });
                            } else {
                                keys.forEach(subKey => {
                                    extraerDeNodo(nodoActual[subKey], `${subNombreLote} - ${subKey}`);
                                });
                            }
                        };

                        extraerDeNodo(nodoColor, nombreBonito);
                    });

                    if (cartonesCargados.length > 0) {
                        window.allAvailableCards = cartonesCargados;
                        let sesionRecuperada = window.cargarEstadoDesdeLocalStorage();
                        if (!sesionRecuperada || window.selectedCardsIds.length === 0) {
                            window.selectedCardsIds = [];
                        }
                        
                        window.renderMasterBoard();
                        window.buildCardSelectorModalList();
                        window.initModalitiesList();
                        window.initActiveCards();
                        window.updateDrawnCountBadge();
                        window.renderPlayerCards();
                    }
                }
            } catch (error) {
                console.error("Error al cargar cartones desde la raíz:", error);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('bingo_bg_theme') || 'dark';
            document.getElementById('bg-theme-selector').value = savedTheme;
            window.changeBackgroundTheme(savedTheme);
            
            if (localStorage.getItem('bingo_side_by_side') === 'true') {
                document.body.classList.add('side-by-side-mobile');
            }

            window.cargarEstadoDesdeLocalStorage();
            window.renderMasterBoard();
            window.initModalitiesList();
            cargarCartonesDesdeFirebase();
        });
    </script>

        window.selectAllForGroup = function(gKey, selectStatus) {
            window.allAvailableCards.forEach(card => {
                let cardGKey = `${card.color}_${card.batch}`;
                if (cardGKey === gKey) {
                    let idx = window.selectedCardsIds.indexOf(card.id);
                    if (selectStatus && idx === -1) {
                        window.selectedCardsIds.push(card.id);
                    } else if (!selectStatus && idx !== -1) {
                        window.selectedCardsIds.splice(idx, 1);
                        delete window.cardMarks[card.id];
                        delete window.playerNames[card.id];
                    }
                }
            });

            window.buildCardSelectorModalList(document.getElementById('card-search-input').value);
            window.guardarEstadoEnLocalStorage();
            window.initActiveCards();
        }

        window.applyMultiSelectForGroup = function(gKey, selectStatus) {
            const inputEl = document.getElementById(`multi-range-${gKey}`);
            const nameEl = document.getElementById(`batch-name-${gKey}`);
            const inputVal = inputEl.value.trim();
            const nameVal = nameEl ? nameEl.value.trim() : "";

            if (!inputVal) {
                alert("Por favor ingresa números o rangos (ej: 1,4,15 o 40-69).");
                return;
            }

            let targetNumbers = new Set();
            inputVal.split(',').forEach(part => {
                part = part.trim();
                if (part.includes('-')) {
                    let rangeParts = part.split('-');
                    let start = parseInt(rangeParts[0]);
                    let end = parseInt(rangeParts[1]);
                    if (!isNaN(start) && !isNaN(end)) {
                        let min = Math.min(start, end);
                        let max = Math.max(start, end);
                        for (let i = min; i <= max; i++) targetNumbers.add(i);
                    }
                } else {
                    let num = parseInt(part);
                    if (!isNaN(num)) targetNumbers.add(num);
                }
            });

            window.allAvailableCards.forEach(card => {
                let cardGKey = `${card.color}_${card.batch}`;
                if (cardGKey === gKey && targetNumbers.has(card.numberId)) {
                    let idx = window.selectedCardsIds.indexOf(card.id);
                    if (selectStatus) {
                        if (idx === -1) window.selectedCardsIds.push(card.id);
                        if (nameVal) window.playerNames[card.id] = nameVal;
                    } else if (!selectStatus && idx !== -1) {
                        window.selectedCardsIds.splice(idx, 1);
                        delete window.cardMarks[card.id];
                        delete window.playerNames[card.id];
                    }
                }
            });

            if (selectStatus) {
                inputEl.value = '';
                if (nameEl && nameVal) nameEl.value = '';
            }

            window.buildCardSelectorModalList(document.getElementById('card-search-input').value);
            window.guardarEstadoEnLocalStorage();
            window.initActiveCards();
        }

        window.applyNameToGroup = function(gKey) {
            const nameEl = document.getElementById(`batch-name-${gKey}`);
            const nameVal = nameEl.value.trim();
            if (!nameVal) {
                alert("Por favor escribe un nombre para asignar.");
                return;
            }

            let countAssigned = 0;
            window.allAvailableCards.forEach(card => {
                let cardGKey = `${card.color}_${card.batch}`;
                let hasNameAlready = window.playerNames[card.id] && window.playerNames[card.id].trim() !== "";
                if (cardGKey === gKey && window.selectedCardsIds.includes(card.id) && !hasNameAlready) {
                    window.playerNames[card.id] = nameVal;
                    countAssigned++;
                }
            });

            window.guardarEstadoEnLocalStorage();
            window.initActiveCards();
            
            if (countAssigned > 0) {
                nameEl.value = '';
                alert(`¡Nombre asignado correctamente a ${countAssigned} cartón(es)!`);
            } else {
                alert(`Aviso: No hay cartones seleccionados sin nombre en este grupo.`);
            }
        }

        window.getMissingCellsForMode = function(card, marks, modeKey) {
            let missing = [];
            let mode = window.gameModes[modeKey];
            if (!mode) return missing;

            if (modeKey === 'blackout') {
                for (let r = 0; r < 5; r++) {
                    for (let c = 0; c < 5; c++) {
                        if (!marks[`${r}-${c}`]) missing.push({r, c});
                    }
                }
            } else if (modeKey === 'diagonal') {
                let d1Unmarked = [];
                for (let i = 0; i < 5; i++) { if (!marks[`${i}-${i}`]) d1Unmarked.push({r: i, c: i}); }
                let d2Unmarked = [];
                for (let i = 0; i < 5; i++) { if (!marks[`${i}-${4-i}`]) d2Unmarked.push({r: i, c: 4-i}); }
                if (d1Unmarked.length === 1) missing.push(d1Unmarked[0]);
                if (d2Unmarked.length === 1) missing.push(d2Unmarked[0]);
            } else if (modeKey === 'horizontal') {
                for (let r = 0; r < 5; r++) {
                    let rowUnmarked = [];
                    for (let c = 0; c < 5; c++) { if (!marks[`${r}-${c}`]) rowUnmarked.push({r, c}); }
                    if (rowUnmarked.length === 1) missing.push(rowUnmarked[0]);
                }
            } else if (modeKey === 'vertical') {
                for (let c = 0; c < 5; c++) {
                    let colUnmarked = [];
                    for (let r = 0; r < 5; r++) { if (!marks[`${r}-${c}`]) colUnmarked.push({r, c}); }
                    if (colUnmarked.length === 1) missing.push(colUnmarked[0]);
                }
            } else if (modeKey === 'corners') {
                let corners = [{r:0, c:0}, {r:0, c:4}, {r:4, c:0}, {r:4, c:4}];
                let unmar = corners.filter(pos => !marks[`${pos.r}-${pos.c}`]);
                if (unmar.length === 1) missing.push(unmar[0]);
            } else {
                let patternUnmarked = [];
                for (let r = 0; r < 5; r++) {
                    for (let c = 0; c < 5; c++) {
                        if (mode.isCellInPattern(r, c) && !marks[`${r}-${c}`]) {
                            patternUnmarked.push({r, c});
                        }
                    }
                }
                if (patternUnmarked.length === 1) {
                    missing.push(patternUnmarked[0]);
                }
            }
            return missing;
        }

        window.getAllMissingNumbersAcrossCards = function() {
            let missingNumbersSet = new Set();
            window.selectedCardsIds.forEach(id => {
                let card = window.allAvailableCards.find(c => c.id === id);
                if (!card) return;
                let marks = window.cardMarks[card.id] || {};

                for (let mKey in window.gameModes) {
                    let mode = window.gameModes[mKey];
                    if (!mode.active) continue;
                    let missing = window.getMissingCellsForMode(card, marks, mKey);
                    if (missing.length === 1) {
                        missing.forEach(pos => {
                            let num = card.numbers[pos.r][pos.c];
                            if (typeof num === 'number') missingNumbersSet.add(num);
                        });
                    }
                }
            });
            return missingNumbersSet;
        }

        window.renderPlayerCards = function() {
            let nearWinContainer = document.getElementById('near-win-cards-container');
            let nearWinCountBadge = document.getElementById('near-win-count-badge');
            let nearWinListHTML = '';
            let totalNearWinCount = 0;

            window.selectedCardsIds.forEach(id => {
                let card = window.allAvailableCards.find(c => c.id === id);
                if (!card) return;
                let cfg = window.getCardColorConfig(card.color);
                let marks = window.cardMarks[card.id] || {};
                let pName = window.playerNames[card.id] || "";

                let missingCellsMap = {};
                for (let mKey in window.gameModes) {
                    let mode = window.gameModes[mKey];
                    if (!mode.active) continue;
                    let missing = window.getMissingCellsForMode(card, marks, mKey);
                    if (missing.length === 1) {
                        missing.forEach(pos => {
                            missingCellsMap[`${pos.r}-${pos.c}`] = true;
                            totalNearWinCount++;
                            nearWinListHTML += `<div class="text-[9px] bg-amber-500/10 border border-amber-500/30 rounded px-1.5 py-0.5 text-amber-300 flex justify-between items-center gap-1 min-w-0">

                                <span class="bg-amber-500 text-slate-950 font-bold px-1 rounded text-[8.5px] shrink-0">${card.numbers[pos.r][pos.c]}</span>
                            </div>`;
                        });
                    }
                }

                for (let r = 0; r < 5; r++) {
                    for (let col = 0; col < 5; col++) {
                        let val = card.numbers[r][col];
                        let btn = document.getElementById(`cell-${card.id}-${r}-${col}`);
                        if (!btn) continue;

                        if (val === "FREE") continue;

                        let isMarked = marks[`${r}-${col}`];
                        let isMissing = missingCellsMap[`${r}-${col}`];

                        if (isMarked) {
                            btn.className = `active-card-cell h-6 sm:h-7 rounded text-[10px] sm:text-[11px] font-bold flex items-center justify-center border min-w-0 ${cfg.markedClass}`;
                        } else if (isMissing) {
                            btn.className = `active-card-cell h-6 sm:h-7 rounded text-[10px] sm:text-[11px] font-bold flex items-center justify-center border min-w-0 bg-amber-500 text-slate-950 animate-pulse font-extrabold`;
                        } else {
                            btn.className = `active-card-cell h-6 sm:h-7 rounded text-[10px] sm:text-[11px] font-bold flex items-center justify-center border min-w-0 bg-slate-800 text-slate-200 border-slate-700`;
                        }
                    }
                }
            });

            if (nearWinContainer) {
                nearWinContainer.innerHTML = nearWinListHTML || `<div class="text-[9px] text-slate-400 text-center py-1.5 italic">Ninguno a pique...</div>`;
            }
            if (nearWinCountBadge) {
                nearWinCountBadge.textContent = `${totalNearWinCount}`;
            }

            window.renderMasterBoard();
            
            if (!document.getElementById('projector-modal').classList.contains('hidden')) {
                window.renderProjectorBoard();
            }
        }

        window.renderMasterBoard = function() {
            const container = document.getElementById('master-board-columns');
            const recentContainer = document.getElementById('recent-balls-history');
            if (!container) return;
            container.innerHTML = '';
            const letters = ['B', 'I', 'N', 'G', 'O'];
            
            let missingNumbersSet = window.getAllMissingNumbersAcrossCards();
            
            if (recentContainer) {
                if (window.drawnHistoryArray.length === 0) {
                    recentContainer.innerHTML = `<span class="text-[9px] text-slate-500 italic">Sin bolas</span>`;
                } else {
                    recentContainer.innerHTML = '';
                    let ultimas = window.drawnHistoryArray.slice(-6).reverse();
                    ultimas.forEach(num => {
                        let span = document.createElement('span');
                        span.className = "bg-indigo-600 text-white font-black px-1.5 py-0.2 rounded text-[9px] shadow-sm shrink-0";
                        span.textContent = num;
                        recentContainer.appendChild(span);
                    });
                }
            }

            for (let col = 0; col < 5; col++) {
                const colDiv = document.createElement('div');
                colDiv.className = 'flex flex-col gap-0.5 min-w-0';
                colDiv.innerHTML = `<div class="bg-indigo-600 text-white font-bold text-center text-[9px] py-0.5 rounded">${letters[col]}</div>`;
               
                for (let row = 1; row <= 15; row++) {
                    const num = col * 15 + row;
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.id = `master-num-${num}`;
                    
                    let isDrawn = window.masterMarkedNumbers.has(num);
                    let isMissingForWin = missingNumbersSet.has(num) && !isDrawn;
                    
                    let cssClass = 'bg-slate-950 text-slate-400 border-slate-800 hover:text-white';
                    if (isDrawn) {
                        cssClass = 'master-cell-marked';
                    } else if (isMissingForWin) {
                        cssClass = 'master-cell-missing';
                    }

                    btn.className = `h-4 sm:h-5 flex items-center justify-center text-[9px] font-bold rounded border w-full min-w-0 ${cssClass}`;
                    btn.textContent = num;
                    btn.onclick = () => window.toggleMasterNumber(num);
                    colDiv.appendChild(btn);
                }
                container.appendChild(colDiv);
            }
            window.updateDrawnCountBadge();
        }

        window.toggleMasterNumber = function(num) {
            if (window.masterMarkedNumbers.has(num)) {
                window.masterMarkedNumbers.delete(num);
                window.autoUnmarkNumberOnCards(num);
                window.drawnHistoryArray = window.drawnHistoryArray.filter(n => n !== num);
            } else {
                window.masterMarkedNumbers.add(num);
                window.autoMarkNumberOnCards(num);
                if (!window.drawnHistoryArray.includes(num)) {
                    window.drawnHistoryArray.push(num);
                }
            }
            window.renderMasterBoard();
            window.renderPlayerCards();
            window.checkAllCardsForWins();
            window.guardarEstadoEnLocalStorage();
        }

        window.autoMarkNumberOnCards = function(num) {
            window.selectedCardsIds.forEach(id => {
                let card = window.allAvailableCards.find(c => c.id === id);
                if (!card) return;
                for (let r = 0; r < 5; r++) {
                    for (let col = 0; col < 5; col++) {
                        if (card.numbers[r][col] === num) {
                            if (!window.cardMarks[card.id]) window.cardMarks[card.id] = {};
                            window.cardMarks[card.id][`${r}-${col}`] = true;
                        }
                    }
                }
            });
        }

        window.autoUnmarkNumberOnCards = function(num) {
            window.selectedCardsIds.forEach(id => {
                let card = window.allAvailableCards.find(c => c.id === id);
                if (!card) return;
                for (let r = 0; r < 5; r++) {
                    for (let col = 0; col < 5; col++) {
                        if (card.numbers[r][col] === num) {
                            if (window.cardMarks[card.id]) window.cardMarks[card.id][`${r}-${col}`] = false;
                        }
                    }
                }
            });
        }

        window.getWonModalitiesForCard = function(cardId) {
            let marks = window.cardMarks[cardId] || {};
            let wonModesNames = [];

            for (let mKey in window.gameModes) {
                let mode = window.gameModes[mKey];
                if (!mode.active) continue;
                let isWon = false;

                if (mKey === 'blackout') {
                    let allMarked = true;
                    for (let r = 0; r < 5; r++) {
                        for (let c = 0; c < 5; c++) {
                            if (!marks[`${r}-${c}`]) allMarked = false;
                        }
                    }
                    if (allMarked) isWon = true;
                } else if (mKey === 'diagonal') {
                    let d1 = [0,1,2,3,4].every(i => marks[`${i}-${i}`]);
                    let d2 = [0,1,2,3,4].every(i => marks[`${i}-${4-i}`]);
                    if (d1 || d2) isWon = true;
                } else if (mKey === 'horizontal') {
                    for (let r = 0; r < 5; r++) {
                        if ([0,1,2,3,4].every(c => marks[`${r}-${c}`])) isWon = true;
                    }
                } else if (mKey === 'vertical') {
                    for (let c = 0; c < 5; c++) {
                        if ([0,1,2,3,4].every(r => marks[`${r}-${c}`])) isWon = true;
                    }
                } else if (mKey === 'corners') {
                    if (marks['0-0'] && marks['0-4'] && marks['4-0'] && marks['4-4']) isWon = true;
                } else {
                    let customWon = true;
                    for (let r = 0; r < 5; r++) {
                        for (let c = 0; c < 5; c++) {
                            if (mode.isCellInPattern(r, c) && !marks[`${r}-${c}`]) {
                                customWon = false;
                            }
                        }
                    }
                    if (customWon) isWon = true;
                }

                if (isWon) {
                    wonModesNames.push(mode.name);
                }
            }
            return wonModesNames;
        }

        window.checkAllCardsForWins = function() {
            let winningInfoList = [];
            window.selectedCardsIds.forEach(id => {
                let wonModes = window.getWonModalitiesForCard(id);
                if (wonModes.length > 0) {
                    let newWonModesForThisCard = wonModes.filter(modName => {
                        let uniqueKeyWin = `${id}_${modName}`;
                        return !window.alreadyDeclaredWins.has(uniqueKeyWin);
                    });

                    if (newWonModesForThisCard.length > 0) {
                        newWonModesForThisCard.forEach(modName => {
                            window.alreadyDeclaredWins.add(`${id}_${modName}`);
                        });
                        winningInfoList.push({ cardId: id, modalities: newWonModesForThisCard });
                    }
                }
            });

            if (winningInfoList.length > 0) {
                window.guardarEstadoEnLocalStorage();
                window.showWinModal(winningInfoList);
            }
        }

        window.getWinningCellsSet = function(cardId, wonModalitiesNames) {
            let marks = window.cardMarks[cardId] || {};
            let winningCells = new Set();

            for (let mKey in window.gameModes) {
                let mode = window.gameModes[mKey];
                if (!wonModalitiesNames.includes(mode.name)) continue;

                if (mKey === 'blackout') {
                    for (let r = 0; r < 5; r++) {
                        for (let c = 0; c < 5; c++) winningCells.add(`${r}-${c}`);
                    }
                } else if (mKey === 'diagonal') {
                    if ([0,1,2,3,4].every(i => marks[`${i}-${i}`])) {
                        [0,1,2,3,4].forEach(i => winningCells.add(`${i}-${i}`));
                    }
                    if ([0,1,2,3,4].every(i => marks[`${i}-${4-i}`])) {
                        [0,1,2,3,4].forEach(i => winningCells.add(`${i}-${4-i}`));
                    }
                } else if (mKey === 'horizontal') {
                    for (let r = 0; r < 5; r++) {
                        if ([0,1,2,3,4].every(c => marks[`${r}-${c}`])) {
                            for (let c = 0; c < 5; c++) winningCells.add(`${r}-${c}`);
                        }
                    }
                } else if (mKey === 'vertical') {
                    for (let c = 0; c < 5; c++) {
                        if ([0,1,2,3,4].every(r => marks[`${r}-${c}`])) {
                            for (let r = 0; r < 5; r++) winningCells.add(`${r}-${c}`);
                        }
                    }
                } else if (mKey === 'corners') {
                    ['0-0', '0-4', '4-0', '4-4'].forEach(pos => winningCells.add(pos));
                } else {
                    for (let r = 0; r < 5; r++) {
                        for (let c = 0; c < 5; c++) {
                            if (mode.isCellInPattern(r, c)) winningCells.add(`${r}-${c}`);
                        }
                    }
                }
            }
            return winningCells;
        }

        window.showWinModal = function(winningInfoList) {
            const modal = document.getElementById('win-modal');
            const container = document.getElementById('winning-cards-preview-container');
            if (!modal || !container) return;
            container.innerHTML = '';

            winningInfoList.forEach(item => {
                let card = window.allAvailableCards.find(c => c.id === item.cardId);
                if (!card) return;
                let playerName = window.playerNames[card.id] || "Jugador sin nombre";
                let modalitiesText = item.modalities.join(", ");
                let winningCells = window.getWinningCellsSet(card.id, item.modalities);

                let div = document.createElement('div');
                div.className = 'mini-carton-ganador';
                div.innerHTML = `
                    <h4>Cartón ${card.title}</h4>
                    <div class="ganador-jugador"><i class="fa-solid fa-user"></i> ${playerName}</div>
                    <div class="ganador-modalidad"><i class="fa-solid fa-trophy"></i> ${modalitiesText}</div>
                `;

                let grid = document.createElement('div');
                grid.className = 'mini-grid';
                for (let r = 0; r < 5; r++) {
                    for (let c = 0; c < 5; c++) {
                        let val = card.numbers[r][c];
                        let cell = document.createElement('div');
                        cell.className = 'mini-celda';
                        if (val === "FREE") {
                            cell.classList.add('libre');
                            cell.textContent = 'FREE';
                        } else {
                            cell.textContent = val;
                            if (winningCells.has(`${r}-${c}`)) {
                                cell.classList.add('ganadora');
                            }
                        }
                        grid.appendChild(cell);
                    }
                }
                div.appendChild(grid);
                container.appendChild(div);
            });
            modal.classList.remove('hidden');
        }

        window.closeWinModal = function() {
            document.getElementById('win-modal').classList.add('hidden');
        }

        window.openProjectorMode = function() {
            const modal = document.getElementById('projector-modal');
            if (!modal) return;
            modal.classList.remove('hidden');
            window.renderProjectorBoard();
        }

        window.closeProjectorMode = function() {
            document.getElementById('projector-modal').classList.add('hidden');
        }

        window.renderProjectorBoard = function() {
            const grid = document.getElementById('projector-board-grid');
            const badge = document.getElementById('projector-count-badge');
            const recentProj = document.getElementById('projector-recent-balls');
            const modalitiesProj = document.getElementById('projector-modalities-bar');
            const nearWinProj = document.getElementById('projector-near-win-container');

            if (!grid) return;

            if (badge) badge.textContent = `${window.masterMarkedNumbers.size}`;

            if (recentProj) {
                if (window.drawnHistoryArray.length === 0) {
                    recentProj.innerHTML = `<span class="text-[10px] text-slate-500 italic">Ninguna</span>`;
                } else {
                    recentProj.innerHTML = '';
                    let ultimas = window.drawnHistoryArray.slice(-6).reverse();
                    ultimas.forEach(num => {
                        let span = document.createElement('span');
                        span.className = "bg-indigo-600 text-white font-black px-2 py-0.5 rounded text-[10px] shadow-sm";
                        span.textContent = num;
                        recentProj.appendChild(span);
                    });
                }
            }

            if (modalitiesProj) {
                modalitiesProj.innerHTML = '';
                let hayActivas = false;
                for (let key in window.gameModes) {
                    let mode = window.gameModes[key];
                    if (mode.active) {
                        hayActivas = true;
                        let item = document.createElement('div');
                        item.className = "flex items-center gap-1 bg-slate-950 border border-indigo-500/30 px-1.5 py-0.5 rounded text-[10px] text-indigo-300 shrink-0";
                        item.innerHTML = `${window.generateMiniDiagramHTML(mode.isCellInPattern)} <span class="font-semibold">${mode.name}</span>`;
                        modalitiesProj.appendChild(item);
                    }
                }
                if (!hayActivas) modalitiesProj.innerHTML = `<span class="text-[10px] text-slate-500 italic">Sin modalidades</span>`;
            }

            if (nearWinProj) {
                nearWinProj.innerHTML = '';
                let nearWinCount = 0;
                let nearWinHTML = '';

                window.selectedCardsIds.forEach(id => {
                    let card = window.allAvailableCards.find(c => c.id === id);
                    if (!card) return;
                    let marks = window.cardMarks[card.id] || {};
                    let pName = window.playerNames[card.id] || "";

                    for (let mKey in window.gameModes) {
                        let mode = window.gameModes[mKey];
                        if (!mode.active) continue;
                        let missing = window.getMissingCellsForMode(card, marks, mKey);
                        if (missing.length === 1) {
                            missing.forEach(pos => {
                                nearWinCount++;
                                nearWinHTML += `<div class="text-[9px] bg-amber-500/20 border border-amber-500/40 rounded px-1.5 py-0.5 text-amber-300 whitespace-nowrap">
                                    <b>${card.title}</b> ${pName ? '('+pName+')' : ''} - <span class="bg-amber-500 text-slate-950 font-bold px-1 rounded">Falta: ${card.numbers[pos.r][pos.c]}</span>
                                </div>`;
                            });
                        }
                    }
                });

                if (nearWinCount > 0) {
                    nearWinProj.innerHTML = nearWinHTML;
                } else {
                    nearWinProj.innerHTML = `<span class="text-[10px] text-slate-500 italic">Ninguno</span>`;
                }
            }

            grid.innerHTML = '';
            const letters = ['B', 'I', 'N', 'G', 'O'];
            let missingNumbersSet = window.getAllMissingNumbersAcrossCards();

            for (let col = 0; col < 5; col++) {
                const colDiv = document.createElement('div');
                colDiv.className = 'flex flex-col gap-1 min-w-0';
                colDiv.innerHTML = `<div class="bg-indigo-600 text-white font-black text-center text-xs sm:text-sm py-1 rounded-lg shadow">${letters[col]}</div>`;

                for (let row = 1; row <= 15; row++) {
                    const num = col * 15 + row;
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    
                    let isDrawn = window.masterMarkedNumbers.has(num);
                    let isMissing = missingNumbersSet.has(num) && !isDrawn;

                    let cssClass = 'bg-slate-950 text-slate-400 border-slate-800 hover:border-indigo-500 hover:text-white';
                    if (isDrawn) {
                        cssClass = 'master-cell-marked text-white';
                    } else if (isMissing) {
                        cssClass = 'master-cell-missing';
                    }

                    btn.className = `h-7 sm:h-8 flex items-center justify-center text-xs sm:text-sm font-black rounded-md border transition-all ${cssClass}`;
                    btn.textContent = num;
                    
                    btn.onclick = () => {
                        window.toggleMasterNumber(num);
                        window.renderProjectorBoard();
                    };

                    colDiv.appendChild(btn);
                }
                grid.appendChild(colDiv);
            }
        }

        window.updateDrawnCountBadge = function() {
            document.getElementById('drawn-count-badge').textContent = `${window.masterMarkedNumbers.size}`;
        }

        window.clearAllMarks = function() {
            window.cardMarks = {};
            window.alreadyDeclaredWins.clear();
            window.selectedCardsIds.forEach(id => window.cardMarks[id] = { "2-2": true });
            window.renderPlayerCards();
            window.guardarEstadoEnLocalStorage();
        }

        window.resetGame = function() {
            window.masterMarkedNumbers.clear();
            window.drawnHistoryArray = [];
            window.cardMarks = {};
            window.alreadyDeclaredWins.clear();
            window.selectedCardsIds.forEach(id => window.cardMarks[id] = { "2-2": true });
            window.renderMasterBoard();
            window.renderPlayerCards();
            window.closeWinModal();
            window.guardarEstadoEnLocalStorage();
        }

        window.downloadApp = function() {
            const blob = new Blob([document.documentElement.outerHTML], { type: 'text/html;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'bingo_de_yois_optimizado.html';
            a.click();
            URL.revokeObjectURL(url);
        }
    </script>
</body>
